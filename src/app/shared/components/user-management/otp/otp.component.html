<div class="w-100">

  <header>
    <span>{{ 'user.otp.title' | translate }}</span>

    <button (click)="dismiss.emit()">{{ 'searchBox.close' | translate }}</button>
  </header>
  
  <div class="otp">
    <div class="otp__icon">
      <img src="assets/icons/user/key-icon.svg" title="Key Icon" />
    </div>
  
    <p>{{ 'user.otp.message' | translate }}</p>
  
    <ng-otp-input
      (onInputChange)="onOtpChange($event)"
      [config]="{
        length: 6,
        allowNumbersOnly: true,
      }"
    ></ng-otp-input>
  
    <p
      [ngStyle]="{
        visibility: error ? 'visible' : 'hidden'
      }"
      class="validation-msg"
    >
      {{ 'user.otp.error' | translate }}
    </p>

    <p
      *ngIf="resendError"
      class="validation-msg"
      style="visibility: visible;"
    >
      {{ 'user.register.invalidUserError' | translate }}
    </p>

    <p
      *ngIf="resendSuccess"
      class="success-msg"
    >
      {{ 'user.otp.resendSuccess' | translate }}
    </p>

    <div class="otp__resend">
      <button 
        (click)="resendOtp()" 
        [disabled]="authService.isLoading || !canResend"
        [ngClass]="{ 'otp__resend-btn--disabled': !canResend || authService.isLoading }"
        class="otp__resend-btn"
      >
        <span *ngIf="!authService.isLoading">
          {{ 'user.otp.resend' | translate }}
          <span *ngIf="!canResend" class="otp__resend-timer">({{ resendTimer }}s)</span>
        </span>
        <span *ngIf="authService.isLoading">
          Sending...
        </span>
      </button>
    </div>
  </div>
</div>
