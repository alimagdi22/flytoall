<div

>

  <div class="h-100 my-3 d-flex flex-column justify-content-center align-self-center">
    <p class="h2 fw-bold text-white text-center">{{ 'home.promoTitle' | translate }}</p>
    <p class="h6 text-white text-center mb-5">{{ 'home.promoContent' | translate }}</p>

    <div class="d-flex justify-content-center">
      <button mat-button class="h-100">
        <img src="assets/icons/apple-store-button.svg" />

      <button mat-button class="h-100">

    </div>
